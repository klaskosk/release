ref:
  as: telcov10n-verify-junit-reports-bastion
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-verify-junit-reports-bastion-commands.sh
  documentation: |-
    Fetch JUnit reports from the bastion directory recorded by the test steps
    in SHARED_DIR/bastion_junit_report_dir. Verify them in the pod without
    putting the XML into SHARED_DIR, which is backed by a Kubernetes Secret.
  grace_period: 10s
  timeout: 30m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: KNOWN_FAILURES
    default: "[]"
    documentation: |-
      Test cases that are known to fail. JSON array of test identifiers to skip.
      Examples:
      - Simple array: ["TestCaseA", "TestCaseB"]
      - With URLs: [{"test_id": "TestCaseA", "url": "https://issues.example.com/123"}]
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
