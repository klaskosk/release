ref:
  as: telcov10n-functional-cnf-network-cnf-reporter
  from: src
  commands: telcov10n-functional-cnf-network-cnf-reporter-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: REPORTER_TEMPLATE_NAME 
    default: ""
    documentation: Template name
  - name: REPORTPORTAL_FILES
    default: ".reportportal_url_Net_core"
    documentation: Bastion filename for the launch URL read by the Slack notification
